version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bi_bi_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5050}
    volumes:
      # Mount thư mục uploads và backups ra ngoài máy chủ để dữ liệu không bị mất khi restart/rebuild container
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5050}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
