services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bi_bi_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:${PORT:-5050}"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-5050}
      - DB_PROVIDER=${DB_PROVIDER:-supabase}
      - SUPABASE_URL=${SUPABASE_URL:-https://uotzztasrxdxdxunleny.supabase.co}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_raif2dls9os3gJmZ0aqEcg_b0G_kxBb}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-sb_secret_IhQwlbLdpmNce-BmJBKCvw_P8xSNTDj}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL:-https://uotzztasrxdxdxunleny.supabase.co/auth/v1/.well-known/jwks.json}
      - DB_HOST=${DB_HOST:-db.uotzztasrxdxdxunleny.supabase.co}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-P@ssw0rd@#$_Hieudev}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:P%40ssw0rd%40%23%24_Hieudev@db.uotzztasrxdxdxunleny.supabase.co:5432/postgres}
      - VIETQR_BANK_ID=${VIETQR_BANK_ID:-MB}
      - VIETQR_BANK_NAME=${VIETQR_BANK_NAME:-MB Bank (Ngân hàng TMCP Quân Đội)}
      - VIETQR_ACCOUNT_NO=${VIETQR_ACCOUNT_NO:-3330106140201}
      - VIETQR_ACCOUNT_NAME=${VIETQR_ACCOUNT_NAME:-BUI THI KIEU OANH}
      - VIETQR_TEMPLATE=${VIETQR_TEMPLATE:-compact2}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.vn-hcm-1.vietnix.cloud}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-web-bi-images}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-web-bi-images}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-cb58d4590776b0eaUVR0}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-BL4EZGZCng2oK4wGaYe1RaiiLIKHJKksKp2f4UhH}
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-https://s3.vn-hcm-1.vietnix.cloud/web-bi-images}
    volumes:
      # Mount thư mục uploads và backups ra ngoài máy chủ để dữ liệu không bị mất khi restart/rebuild container
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5050}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
